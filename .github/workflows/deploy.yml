name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/afidzulinn/web-inovass

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # -k: Portainer ships with a self-signed cert on :9443
      - name: Trigger Portainer redeploy
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsSk -X POST "$PORTAINER_WEBHOOK_URL"
