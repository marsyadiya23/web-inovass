name: Deploy CMS to cPanel

on:
  push:
    branches: [main]
    paths: [cms/**, .github/workflows/deploy-cms.yml]
  workflow_dispatch:

# Aman dibatalkan di tengah jalan: penanda deploy baru di-upload paling akhir (langkah 3)
concurrency:
  group: deploy-cms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # composer.lock (Symfony 8) butuh PHP >= 8.4.1; samakan dengan versi PHP di cPanel
          extensions: intl, zip

      # vendor/ & aset Filament dibuat di sini, server tidak butuh Composer.
      # Semuanya dibungkus SATU zip: FTP Rumahweb ±5 detik per file/folder, ±20.000 file tidak selesai dalam 6 jam.
      - name: Build
        working-directory: cms
        env:
          CACHE_STORE: array
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          rm .env
          mkdir -p ../dist ../dist-marker
          # .env & isi storage/ tidak masuk zip; .gitignore di storage/ & bootstrap/cache ikut agar foldernya ada
          zip -qr ../dist/release.zip . -x '.env' 'tests/*' 'node_modules/*' 'deploy.php' 'storage/logs/*.log' '.phpunit.result.cache'
          cp deploy.php ../dist/
          date -u > ../dist-marker/deploy-pending

      # 1) release.zip + deploy.php -> /home/inom3994/inovass (akun deploycms; di luar folder publik)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.CMS_FTP_USERNAME }}
          password: ${{ secrets.CMS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      # 2) Penanda deploy: diunggah SETELAH zip selesai, supaya cron tidak mengekstrak zip yang setengah jadi.
      # Cron di server (tiap menit) melihat file ini -> php deploy.php (ekstrak, salin public/, migrate, optimize).
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.CMS_FTP_USERNAME }}
          password: ${{ secrets.CMS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-marker/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-marker.json
