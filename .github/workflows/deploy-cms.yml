name: Deploy CMS to cPanel

on:
  push:
    branches: [main]
    paths: [cms/**, .github/workflows/deploy-cms.yml]
  workflow_dispatch:

# Aman dibatalkan di tengah jalan: penanda deploy-pending di-upload paling akhir
concurrency:
  group: deploy-cms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # composer.lock (Symfony 8) butuh PHP >= 8.4.1; samakan dengan versi PHP di cPanel
          extensions: intl, zip

      # vendor/ & aset Filament dibuat di sini, server tidak butuh Composer.
      # Semuanya dibungkus SATU zip: FTP Rumahweb ±5 detik per file/folder, ±20.000 file tidak selesai dalam 6 jam.
      - name: Build
        working-directory: cms
        env:
          CACHE_STORE: array
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          rm .env
          mkdir -p ../dist ../dist-marker
          # .env & isi storage/ tidak masuk zip; .gitignore di storage/ & bootstrap/cache ikut agar foldernya ada
          zip -qr ../dist/release.zip . -x '.env' 'tests/*' 'node_modules/*' 'deploy.php' 'storage/logs/*.log' '.phpunit.result.cache'
          cp deploy.php ../dist/
          date -u > ../dist-marker/deploy-pending

      # Upload via FTPS dengan curl: berurutan, penanda deploy-pending PALING AKHIR (cron baru bekerja
      # setelah zip lengkap), coba ulang otomatis bila koneksi FTP Rumahweb putus ("Timeout (control socket)").
      # Akun FTP CMS: root = /home/inom3994/inovass (di luar folder publik).
      - name: Upload ke cPanel
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.CMS_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CMS_FTP_PASSWORD }}
        run: |
          up() {
            curl --fail --silent --show-error --ssl-reqd --connect-timeout 30 --retry 5 --retry-all-errors --retry-delay 15 --user "$FTP_USER:$FTP_PASS" -T "$1" "ftp://$FTP_HOST/$(basename "$1")"
            echo "terkirim: $1"
          }
          up dist/release.zip
          up dist/deploy.php
          up dist-marker/deploy-pending
