# Lives on the VPS at /opt/inovass (copied there by the GitHub Actions deploy job).
services:
  web:
    image: ghcr.io/afidzulinn/web-inovass:latest
    container_name: inovass-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"   # direct access http://129.226.157.124:8080

  # Cloudflare Tunnel -> http://web:80, HTTPS by Cloudflare, no open ports needed.
  # Default: Quick Tunnel (random https://xxx.trycloudflare.com, no domain needed; see `docker logs inovass-tunnel`).
  # With a domain: put TUNNEL_ARGS=run --token <token> in /opt/inovass/.env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: inovass-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate ${TUNNEL_ARGS:---url http://web:80}
    depends_on:
      - web
