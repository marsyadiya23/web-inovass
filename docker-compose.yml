# Deployed as a Portainer stack (see README). Portainer webhook re-pulls :latest on every push to main.
services:
  web:
    image: ghcr.io/afidzulinn/web-inovass:latest
    container_name: inovass-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"   # direct access http://129.226.157.124:8080 (testing before domain is live)

  # Cloudflare Tunnel: inovass.com -> http://web:80, HTTPS handled by Cloudflare, no open ports needed
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: inovass-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - web
