server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # behind Cloudflare Tunnel: keep https/host of the original request

    # Clean URLs: /tentang -> tentang.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # CSS/JS have no hashed filenames, so browsers revalidate (cheap 304) to pick up deploys
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
